name: Catalog validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Catalog Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Catalog Project candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog-project
          persist-credentials: false

      - name: Check out Catalog Project baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: catalog-baseline
          persist-credentials: false

      - name: Install workflow parser
        working-directory: catalog-project
        run: python3 -m pip install -r requirements-tooling.txt

      - name: Test source-free entry points and publication boundary
        working-directory: catalog-project
        run: ./scripts/test.sh

      - name: Validate inert catalog content
        working-directory: catalog-project
        shell: bash
        run: |
          args=()
          if [[ -d ../catalog-baseline/packs ]]; then
            args+=(../catalog-baseline)
          fi
          ./scripts/validate.sh "${args[@]}" --json
